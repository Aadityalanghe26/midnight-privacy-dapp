name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile Compact contract
        run: npx compact compile contracts/counter/counter.compact contracts/counter/artifacts

      - name: Run test suite
        run: npx vitest run --project contracts --reporter=verbose

      - name: Build frontend
        run: npm run build --workspace=frontend
