name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Show Node and npm versions
        run: node --version && npm --version

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit 2>&1 || true && npm install --ignore-scripts --no-audit

      - name: Run contract tests
        run: npx vitest run --project contracts --reporter=verbose

      - name: Build frontend
        run: npx vite build --config frontend/vite.config.ts
